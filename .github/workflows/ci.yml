name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore (locked)
        run: dotnet restore MeetSimple.csproj --locked-mode
      - name: Build
        run: dotnet build MeetSimple.csproj -c Release --no-restore
      - name: Fail on vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list MeetSimple.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $report
          if ($report -match 'has the following vulnerable packages') { throw 'Vulnerable NuGet packages found.' }
